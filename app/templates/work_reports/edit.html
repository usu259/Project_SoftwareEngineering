{% extends 'base.html' %}
{% block title %}Edit Work Report{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Edit Work Report</h1>
    <a class="btn btn-secondary" href="{{ url_for('work_reports.get_work_report', work_report_id=work_report.id) }}">Cancel</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            <div class="form-grid form-grid-2">
                <div class="form-group">
                    <label>Title</label>
                    <input name="title" value="{{ work_report.title }}" required>
                </div>
                <div class="form-group">
                    <label>Execution date</label>
                    <input name="execution_date" type="date" value="{{ work_report.execution_date }}" required>
                </div>
                <div class="form-group" style="grid-column: span 2">
                    <label>Description</label>
                    <textarea name="description" required>{{ work_report.description }}</textarea>
                </div>
                <div class="form-group" style="grid-column: span 2">
                    <label>Notes <span style="font-weight:400;color:var(--gray-500)">(optional)</span></label>
                    <textarea name="notes">{{ work_report.notes or '' }}</textarea>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Save Changes</button>
                <a class="btn btn-secondary" href="{{ url_for('work_reports.get_work_report', work_report_id=work_report.id) }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
