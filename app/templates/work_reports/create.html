{% extends 'base.html' %}
{% block title %}New Work Report{% endblock %}
{% block content %}
<div class="page-header">
    <h1>New Work Report</h1>
    <a class="btn btn-secondary" href="{{ url_for('work_reports.list_work_reports') }}">Cancel</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            <div class="form-grid form-grid-2">
                <div class="form-group">
                    <label>Customer</label>
                    <select name="customer_id" required>
                        <option value="" disabled selected>Select a customer…</option>
                        {% for c in customers %}
                        <option value="{{ c.id }}">{{ c.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Employee</label>
                    <select name="employee_id" required>
                        <option value="" disabled selected>Select an employee…</option>
                        {% for e in employees %}
                        <option value="{{ e.id }}">{{ e.full_name }} — {{ e.role.value | capitalize }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Title</label>
                    <input name="title" required>
                </div>
                <div class="form-group">
                    <label>Execution date</label>
                    <input name="execution_date" type="date" required>
                </div>
                <div class="form-group" style="grid-column: span 2">
                    <label>Description</label>
                    <textarea name="description" required></textarea>
                </div>
                <div class="form-group" style="grid-column: span 2">
                    <label>Notes <span style="font-weight:400;color:var(--gray-500)">(optional)</span></label>
                    <textarea name="notes"></textarea>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Create Work Report</button>
                <a class="btn btn-secondary" href="{{ url_for('work_reports.list_work_reports') }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
