{% extends 'base.html' %}
{% block content %}
<h1>Customers</h1>
<p><a href="{{ url_for('customers.create_customer') }}">+ New customer</a></p>
<table>
    <tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>City</th><th></th></tr>
    {% for c in customers %}
    <tr>
        <td>{{ c.id }}</td>
        <td>{{ c.full_name }}</td>
        <td>{{ c.email }}</td>
        <td>{{ c.phone }}</td>
        <td>{{ c.address.city }}</td>
        <td>
            <a href="{{ url_for('customers.get_customer', customer_id=c.id) }}">View</a> |
            <a href="{{ url_for('customers.edit_customer', customer_id=c.id) }}">Edit</a>
        </td>
    </tr>
    {% else %}
    <tr><td colspan="6">No customers.</td></tr>
    {% endfor %}
</table>
{% endblock %}
