{% extends 'base.html' %}
{% block title %}Edit Invoice #{{ invoice.id }}{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Edit Invoice #{{ invoice.id }}</h1>
    <a class="btn btn-secondary" href="{{ url_for('invoices.get_invoice', invoice_id=invoice.id) }}">Cancel</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            <div class="form-grid form-grid-2">
                <div class="form-group">
                    <label>Title</label>
                    <input name="title" value="{{ invoice.title }}" required>
                </div>
                <div class="form-group" style="grid-column: span 2">
                    <label>Description</label>
                    <textarea name="description" required>{{ invoice.description }}</textarea>
                </div>
                <div class="form-group" style="grid-column: span 2">
                    <label>Notes <span style="font-weight:400;color:var(--gray-500)">(optional)</span></label>
                    <textarea name="notes">{{ invoice.notes or '' }}</textarea>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Save Changes</button>
                <a class="btn btn-secondary" href="{{ url_for('invoices.get_invoice', invoice_id=invoice.id) }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
