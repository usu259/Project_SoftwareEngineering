<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Billing App{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2em; max-width: 960px; }
        nav a { margin-right: 1em; }
        table { border-collapse: collapse; width: 100%; margin-top: 1em; }
        th, td { border: 1px solid #ccc; padding: 0.5em; text-align: left; }
        form label { display: block; margin-top: 0.5em; }
        form input, form select, form textarea { width: 100%; padding: 0.4em; box-sizing: border-box; }
        button { margin-top: 1em; padding: 0.5em 1em; cursor: pointer; }
        .flash { padding: 0.7em; background: #fee; border: 1px solid #c33; margin: 1em 0; }
        .actions form { display: inline; }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('customers.list_customers') }}">Customers</a>
        <a href="{{ url_for('work_reports.list_work_reports') }}">Work Reports</a>
        <a href="{{ url_for('invoices.list_invoices') }}">Invoices</a>
        <a href="{{ url_for('employees.list_employees') }}">Employees</a>
    </nav>
    <hr>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, msg in messages %}
            <div class="flash">{{ msg }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</body>
</html>
