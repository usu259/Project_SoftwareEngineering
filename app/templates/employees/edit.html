{% extends 'base.html' %}
{% block title %}Edit {{ employee.full_name }}{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Edit Employee</h1>
    <a class="btn btn-secondary" href="{{ url_for('employees.get_employee', employee_id=employee.id) }}">Cancel</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            <div class="form-grid form-grid-2">
                <div class="form-group">
                    <label>First name</label>
                    <input name="first_name" value="{{ employee.first_name }}" required>
                </div>
                <div class="form-group">
                    <label>Last name</label>
                    <input name="last_name" value="{{ employee.last_name }}" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input name="email" type="email" value="{{ employee.email }}" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input name="phone" value="{{ employee.phone }}" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select name="role" required>
                        {% for role in roles %}
                        <option value="{{ role.value }}" {% if role == employee.role %}selected{% endif %}>{{ role.value | capitalize }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Save Changes</button>
                <a class="btn btn-secondary" href="{{ url_for('employees.get_employee', employee_id=employee.id) }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
