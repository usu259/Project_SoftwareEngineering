{% extends 'base.html' %}
{% block title %}New Employee{% endblock %}
{% block content %}
<div class="page-header">
    <h1>New Employee</h1>
    <a class="btn btn-secondary" href="{{ url_for('employees.list_employees') }}">Cancel</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            <div class="form-grid form-grid-2">
                <div class="form-group">
                    <label>First name</label>
                    <input name="first_name" required>
                </div>
                <div class="form-group">
                    <label>Last name</label>
                    <input name="last_name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input name="email" type="email" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input name="phone" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select name="role" required>
                        {% for role in roles %}
                        <option value="{{ role.value }}">{{ role.value | capitalize }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Create Employee</button>
                <a class="btn btn-secondary" href="{{ url_for('employees.list_employees') }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
